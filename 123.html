<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 隨堂小測驗</title>
  <style>
    /* 基礎設定與字體 */
    body {
      font-family: 'Helvetica Neue', Arial, 'LiHei Pro', '微軟正黑體', sans-serif;
      background-color: #f0f8ff; /* 明亮的淡藍色背景 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #333;
      padding: 20px;
      box-sizing: border-box;
    }

    /* 測驗區塊的主要容器 */
    .quiz-container {
      background-color: #ffffff;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      color: #4a90e2;
      margin-bottom: 25px;
      font-size: 24px;
    }

    /* 自訂提示框 (取代原有的 alert) */
    #customAlert {
      display: none;
      color: #d32f2f;
      background-color: #fde0dc;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 姓名輸入框樣式 */
    .input-group {
      margin-bottom: 25px;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 16px;
    }
    .input-group input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    .input-group input[type="text"]:focus {
      border-color: #4a90e2;
      outline: none;
    }

    /* 題目與選項樣式 */
    .question {
      margin-bottom: 25px;
      background-color: #fafafa;
      padding: 15px;
      border-radius: 10px;
      border-left: 5px solid #ffb347; /* 溫暖的橘色點綴 */
    }
    .question p {
      font-weight: bold;
      margin: 0 0 12px 0;
      font-size: 16px;
      line-height: 1.4;
    }
    .options label {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 15px;
      padding: 10px;
      border-radius: 8px;
      transition: background-color 0.2s;
    }
    .options label:hover {
      background-color: #f0f0f0;
    }
    .options input[type="radio"] {
      margin-right: 12px;
      transform: scale(1.2);
      cursor: pointer;
    }

    /* 按鈕樣式 */
    .submit-btn {
      width: 100%;
      padding: 15px;
      background-color: #4CAF50; /* 明亮的綠色 */
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }
    .submit-btn:hover:not(:disabled) {
      background-color: #45a049;
    }
    .submit-btn:active:not(:disabled) {
      transform: scale(0.98);
    }
    .submit-btn:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    /* 成績顯示區塊 */
    .result {
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      display: none; /* 預設隱藏 */
      animation: fadeIn 0.5s;
    }
    .result.success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }
    
    /* 載入中提示 */
    .loading {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
    
    /* 針對手機版的微調 */
    @media (max-width: 480px) {
      .quiz-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <h1>📝 隨堂小測驗</h1>

    <!-- 錯誤提示區塊 -->
    <div id="customAlert"></div>

    <!-- 學生姓名 -->
    <div class="input-group">
      <label for="studentName">👤 學生姓名：</label>
      <input type="text" id="studentName" placeholder="請輸入你的真實姓名" required>
    </div>

    <!-- 第一題 -->
    <div class="question">
      <p>1. 台灣最高的山是哪一座？</p>
      <div class="options">
        <label><input type="radio" name="q1" value="阿里山"> 阿里山</label>
        <label><input type="radio" name="q1" value="玉山"> 玉山</label>
        <label><input type="radio" name="q1" value="陽明山"> 陽明山</label>
      </div>
    </div>

    <!-- 第二題 -->
    <div class="question">
      <p>2. 水的三態中，固態稱為什麼？</p>
      <div class="options">
        <label><input type="radio" name="q2" value="冰"> 冰</label>
        <label><input type="radio" name="q2" value="水蒸氣"> 水蒸氣</label>
        <label><input type="radio" name="q2" value="雲"> 雲</label>
      </div>
    </div>

    <!-- 送出按鈕 -->
    <button class="submit-btn" id="submitBtn" onclick="submitQuiz()">送出並看成績 🚀</button>
    
    <!-- 狀態顯示 -->
    <div id="loadingMsg" class="loading">成績計算與上傳中，請稍候... ⏳</div>
    <div id="resultMsg" class="result"></div>

  </div>

  <script>
    // 請將這裡替換成您在 GAS 部署後獲得的 Web App URL！
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz8PI7CkRyTKWI7gQTCcv3ValNElacmeepD4XI2LVZD0ZZA_zSfFL8qLGh6ENKqi243/exec"; 

    // 自訂提示框函式 (取代 window.alert)
    function showMessage(msg) {
      const alertBox = document.getElementById('customAlert');
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
      // 3秒後自動隱藏
      setTimeout(() => {
        alertBox.style.display = 'none';
      }, 3000);
    }

    function submitQuiz() {
      // 1. 取得使用者輸入的值
      const name = document.getElementById('studentName').value.trim();
      const q1 = document.querySelector('input[name="q1"]:checked');
      const q2 = document.querySelector('input[name="q2"]:checked');

      // 2. 檢查是否有漏填
      if (!name) {
        showMessage("⚠️ 請記得輸入姓名喔！");
        document.getElementById('studentName').focus();
        return;
      }
      if (!q1 || !q2) {
        showMessage("⚠️ 還有題目沒寫完，請檢查一下！");
        return;
      }

      // 3. 計算成績 (每題 50 分)
      let score = 0;
      if (q1.value === "玉山") score += 50;
      if (q2.value === "冰") score += 50;

      // 4. 顯示成績給學生看
      const resultMsg = document.getElementById('resultMsg');
      const loadingMsg = document.getElementById('loadingMsg');
      const submitBtn = document.getElementById('submitBtn');
      
      resultMsg.style.display = 'block';
      resultMsg.className = 'result success';
      resultMsg.innerHTML = `🎉 太棒了，${name}！<br>你的總得分是：<span style="font-size:24px; color:#d32f2f;">${score}</span> 分`;

      // 5. 準備上傳資料到 Google 試算表
      loadingMsg.style.display = 'block';
      submitBtn.disabled = true; // 鎖定按鈕避免重複點擊

      // 如果您還沒貼上真實的 GAS URL，這裡會模擬一個上傳成功的動畫讓您預覽
      if (GAS_API_URL === "在此貼上您的_GAS_網頁應用程式網址" || GAS_API_URL === "") {
        setTimeout(() => {
          loadingMsg.style.display = 'none';
          submitBtn.innerText = "已成功送出 ✔️";
          submitBtn.style.backgroundColor = "#9e9e9e";
          console.log("模擬連線：成績已成功記錄 (請記得換成真實的 GAS API 網址)");
        }, 1500); // 模擬 1.5 秒的網路延遲
        return;
      }

      // ---------- 以下為真實串接 GAS 試算表的程式碼 ----------
      const payload = {
        name: name,
        score: score
      };

      fetch(GAS_API_URL, {
        method: 'POST',
        // 為了避免 CORS 問題，設定 mode 為 'no-cors' 或者確保 GAS 那邊 ContentService 已經設定好。
        // 如果 GAS 回傳 JSON，通常不需要額外設定 mode，直接 POST 即可
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        loadingMsg.style.display = 'none';
        if(data.status === "success") {
           submitBtn.innerText = "已成功送出 ✔️";
           submitBtn.style.backgroundColor = "#9e9e9e";
        } else {
           showMessage("上傳成績失敗：" + data.message);
           submitBtn.disabled = false;
        }
      })
      .catch(error => {
        loadingMsg.style.display = 'none';
        submitBtn.disabled = false;
        console.error("連線錯誤:", error);
        showMessage("網路連線錯誤，請稍後再試。");
      });
    }
  </script>
</body>
</html>
